plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vbridge.audiobridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.vbridge.audiobridge"
        minSdk 29 // Android 10 is required for AudioPlaybackCapture API
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: (System.getProperty("user.home") + "/.android/debug.keystore")
            def keystoreFile = file(keystorePath)

            if (!keystoreFile.exists() && keystorePath.endsWith("debug.keystore")) {
                keystoreFile.parentFile.mkdirs()
                try {
                    exec {
                        commandLine 'keytool', '-genkeypair', '-v',
                            '-keystore', keystoreFile.absolutePath,
                            '-storepass', 'android',
                            '-alias', 'androiddebugkey',
                            '-keypass', 'android',
                            '-keyalg', 'RSA',
                            '-keysize', '2048',
                            '-validity', '10000',
                            '-dname', 'CN=Android Debug,O=Android,C=US'
                    }
                } catch (Exception e) {
                    println "Warning: Could not auto-generate fallback debug keystore: " + e.message
                }
            }

            storeFile keystoreFile
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // QR Code Scanner library
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
